# Builds and tests the four packages (FM-1, SMK-37 Pro / Elite / MKE-P37). Hingebox fork: releases are made by hand
# from a build that was tested on a keyboard, and nothing is published to mutant.cloud (that's DUMBMIDI's listing).
name: build
on:
  push:
    branches: [main, hingebox]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
      - run: ./fm1 build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.fwsc

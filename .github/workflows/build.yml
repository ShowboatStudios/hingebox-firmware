# Builds the four packages (FM-1, SMK-37 Pro / Elite / MKE-P37); a tag gets a release with them,
# and tells mutant.cloud about it.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
      - run: ./fm1 build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.fwsc
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
      - uses: konsumer/mutantcloud@main
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DUMBMIDI
          devices: fm1,smk37
